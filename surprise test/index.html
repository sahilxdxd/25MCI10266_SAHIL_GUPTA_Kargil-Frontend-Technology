<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart To-Do Manager</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-5">

    <h2 class="title">Smart To-Do Manager</h2>

    <div class="card-box">
        <div class="row g-2">
            <div class="col-md-4">
                <input type="text" id="taskInput" class="form-control" placeholder="Enter Task">
            </div>

            <div class="col-md-3">
                <select id="priorityInput" class="form-control">
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                </select>
            </div>

            <div class="col-md-3">
                <input type="date" id="dateInput" class="form-control">
            </div>

            <div class="col-md-2">
                <button class="add-btn w-100" onclick="addTask()">Add</button>
            </div>
        </div>
    </div>

    <div class="mb-3">
        <button class="filter-btn" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" onclick="setFilter('completed', this)">Completed</button>
        <button class="filter-btn" onclick="setFilter('pending', this)">Pending</button>

        <select id="sortOption" onchange="sortTasks()" class="ms-2">
            <option value="">Sort</option>
            <option value="priority">Priority</option>
            <option value="deadline">Deadline</option>
        </select>
    </div>

    <div class="mb-3">
        Total: <b id="total"></b> |
        Completed: <b id="completed"></b> |
        Pending: <b id="pending"></b>
    </div>

    <div id="taskList"></div>

</div>

<script src="script.js"></script>
</body>
</html>
